<!DOCTYPE html>
<html>
    <head>
        <title>ULabel - Linked Subtasks Demo</title>

        <!-- ULabel Library -->
        <script src="/ulabel.js"></script>

        <!-- JQuery Library -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>

        <!-- ULabel Usage -->
        <script>
            /* global $ */
            /* global ULabel */

            $(window).on("load", function() {

                function on_submit(annotations) {
                    var element = document.createElement("a");
                    element.setAttribute(
                        "href", ("data:text/plain;charset=utf-8," +
                        encodeURIComponent(JSON.stringify(annotations, null, 2))),
                    );
                    element.setAttribute("download", "annotations.json");
                    element.style.display = "none";
                    document.body.appendChild(element);
                    element.click();
                    document.body.removeChild(element);
                }

                // Object boxes shared by all three subtasks (same spatial payload, as a model-vs-GT diff would have)
                const boxes = {
                    "obj-1": [[1079.71, 411.99], [1257.66, 541.35]],
                    "obj-2": [[1268.86, 410.89], [1381.27, 510.38]],
                    "obj-3": [[833.71, 396.29], [871.84, 480.78]],
                    "obj-4": [[898.24, 409.90], [952.93, 470.00]],
                    "obj-5": [[1418.42, 397.04], [1447.58, 484.52]],
                };

                function box(id, link_id, class_id, confidence, annotation_meta = {}) {
                    return {
                        "id": id,
                        "spatial_type": "bbox",
                        "spatial_payload": boxes[link_id],
                        "classification_payloads": [{ "class_id": class_id, "confidence": confidence }],
                        "annotation_meta": { "link_id": link_id, ...annotation_meta },
                    };
                }

                // Diff: one annotation per object, linked to the prediction and GT by `link_id`.
                // `pred_class_name` names the GT class it gives its counterparts (counterpart_class_meta_key).
                const diff_annotations = [
                    box("diff-1", "obj-1", 1, 1, { "pred_class_name": "Car" }), // TP, classes agree
                    box("diff-2", "obj-2", 4, 1, { "pred_class_name": "Pedestrian" }), // Mismatch: GT says Car
                    box("diff-3", "obj-3", 2, 1, { "pred_class_name": "Pedestrian" }), // FP: no GT yet
                    box("diff-4", "obj-4", 3, 1), // FN: no prediction, so no class to give
                    box("diff-5", "obj-5", 2, 1, { "pred_class_name": "Truck" }), // FP: GT has no Truck class
                ];

                const gt_annotations = [
                    box("gt-1", "obj-1", 10, 1),
                    box("gt-2", "obj-2", 10, 1),
                    box("gt-4", "obj-4", 11, 1),
                ];

                const prediction_annotations = [
                    box("pred-1", "obj-1", 10, 0.92),
                    box("pred-2", "obj-2", 11, 0.55),
                    box("pred-3", "obj-3", 11, 0.71),
                    box("pred-5", "obj-5", 12, 0.48),
                ];

                const subtasks = {
                    "diff": {
                        "display_name": "Diff",
                        "inactive_opacity": 0,
                        "classes": [
                            { "name": "TP", "color": "limegreen", "id": 1 },
                            { "name": "FP", "color": "red", "id": 2 },
                            { "name": "FN", "color": "gold", "id": 3 },
                            { "name": "Mismatch", "color": "magenta", "id": 4 },
                        ],
                        "allowed_modes": ["bbox"],
                        "resume_from": diff_annotations,
                    },
                    "gt": {
                        "display_name": "GT",
                        "inactive_opacity": 0,
                        "classes": [
                            { "name": "Car", "color": "orange", "id": 10 },
                            { "name": "Pedestrian", "color": "cyan", "id": 11 },
                        ],
                        "allowed_modes": ["bbox", "polygon"],
                        "resume_from": gt_annotations,
                    },
                    "predictions": {
                        "display_name": "Predictions",
                        "inactive_opacity": 0,
                        "classes": [
                            { "name": "Car", "color": "orange", "id": 10 },
                            { "name": "Pedestrian", "color": "cyan", "id": 11 },
                            { "name": "Truck", "color": "violet", "id": 12 },
                        ],
                        "allowed_modes": ["bbox"],
                        "resume_from": prediction_annotations,
                        "read_only": true,
                    },
                };

                const ulabel = new ULabel({
                    "container_id": "container",
                    "image_data": "/cs-demo-0.png",
                    "username": "DemoUser",
                    "submit_buttons": on_submit,
                    "subtasks": subtasks,
                    "annotation_link_meta_key": "link_id",
                    "counterpart_class_meta_key": "pred_class_name",
                    // Show what links each annotation to the others
                    "hover_card_text": (annotation) => {
                        const meta = annotation.annotation_meta ?? {};
                        const lines = [];
                        if (meta.link_id) lines.push(`link_id: ${meta.link_id}`);
                        if (meta.pred_class_name) lines.push(`pred_class_name: ${meta.pred_class_name}`);
                        if (meta.copied_from) lines.push(`copied_from: ${meta.copied_from.subtask_key}/${meta.copied_from.annotation_id}`);
                        return lines;
                    },
                });
                ulabel.init(function() {
                    // ULabel is now ready for use
                });
                // Expose the instance for e2e tests
                window.ulabel = ulabel;
            });
        </script>
        <style>
            body { margin: 0; padding: 0; }
        </style>
    </head>
    <body>
        <div id="wrapper">
            <div id="container" style="width: 100%; height: 100vh;"></div>
        </div>
    </body>
</html>
