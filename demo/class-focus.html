<!DOCTYPE html>
<html>

<head>
    <title>ULabel - Class Focus</title>

    <!-- ULabel Library -->
    <script src="/ulabel.js"></script>

    <!-- JQuery Library -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>

    <!-- ULabel Usage -->
    <script>
        /* global $ */
        /* global ULabel */

        // Demo for `focus_active_class` + per-class `allowed_modes`:
        // - both subtasks are spatial and multi-class
        // - each class narrows the subtask's modes to its own geometry
        // - selecting a class (toolbox button or keybind) focuses it: other
        //   classes dim, drop out of hover/Tab/the list, and their disallowed
        //   mode buttons hide
        // - entering a delete mode must NOT move the focus (freeze), and a
        //   delete polygon must only remove focused-class annotations

        $(window).on("load", function () {

            function on_submit(annotations) {
                var element = document.createElement('a');
                element.setAttribute(
                    "href", ('data:text/plain;charset=utf-8,' +
                        encodeURIComponent(JSON.stringify(annotations, null, 2)))
                );
                element.setAttribute("download", "annotations.json");
                element.style.display = 'none';
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            }

            const vehicle_annotations = [
                // Sedans (bbox)
                {
                    "spatial_type": "bbox",
                    "spatial_payload": [[1086, 417], [1257, 540]],
                    "classification_payloads": [{ "class_id": 10, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "bbox",
                    "spatial_payload": [[1384, 504], [1273, 413]],
                    "classification_payloads": [{ "class_id": 10, "confidence": 1.0 }],
                },
                // Truck (polygon)
                {
                    "spatial_type": "polygon",
                    "spatial_payload": [[
                        [454, 279], [623, 280], [727, 302], [725, 446], [693, 451],
                        [696, 489], [689, 498], [677, 503], [650, 499], [651, 482],
                        [638, 482], [627, 449], [595, 424], [571, 416], [535, 414],
                        [444, 422], [435, 410], [440, 348], [443, 340], [455, 338],
                        [454, 279],
                    ]],
                    "classification_payloads": [{ "class_id": 11, "confidence": 1.0 }],
                },
                // Lane lines (polyline)
                {
                    "spatial_type": "polyline",
                    "spatial_payload": [
                        [1076, 477], [1062, 492], [1033, 505], [993, 523],
                        [915, 565], [772, 670], [543, 843], [316, 1022],
                    ],
                    "classification_payloads": [{ "class_id": 12, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "polyline",
                    "spatial_payload": [
                        [1631, 975], [1628, 974], [1476, 820],
                        [1377, 708], [1279, 597], [1231, 534],
                    ],
                    "classification_payloads": [{ "class_id": 12, "confidence": 1.0 }],
                },
            ];

            const infrastructure_annotations = [
                // Signs (point)
                {
                    "spatial_type": "point",
                    "spatial_payload": [[1029, 292]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[1445, 326]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[375, 273]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[101, 191]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[56, 189]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[371, 309]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[1442, 357]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[1357, 346]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[630, 227]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "point",
                    "spatial_payload": [[743, 254]],
                    "classification_payloads": [{ "class_id": 20, "confidence": 1.0 }],
                },
                // Buildings (bbox)
                {
                    "spatial_type": "bbox",
                    "spatial_payload": [[1485, 108], [1759, 526]],
                    "classification_payloads": [{ "class_id": 21, "confidence": 1.0 }],
                },
                {
                    "spatial_type": "bbox",
                    "spatial_payload": [[758, 35], [880, 412]],
                    "classification_payloads": [{ "class_id": 21, "confidence": 1.0 }],
                },
            ];

            let subtasks = {
                "vehicles": {
                    "display_name": "Vehicles",
                    "classes": [
                        {
                            "name": "Sedan",
                            "color": "blue",
                            "id": 10,
                            "keybind": "1",
                            // Narrows the subtask's union to bbox only
                            "allowed_modes": ["bbox"],
                        },
                        {
                            "name": "Truck",
                            "color": "orange",
                            "id": 11,
                            "keybind": "2",
                            "allowed_modes": ["bbox", "polygon", "bitmask"],
                        },
                        {
                            "name": "Lane",
                            "color": "yellow",
                            "id": 12,
                            "keybind": "3",
                            "allowed_modes": ["polyline"],
                        },
                    ],
                    // The union of the classes' modes, plus delete modes to
                    // exercise the focus freeze + focus-gated bulk delete
                    "allowed_modes": ["bbox", "polygon", "polyline", "bitmask", "delete_polygon", "delete_bbox"],
                    "resume_from": vehicle_annotations,
                    "task_meta": null,
                    "annotation_meta": null,
                    "focus_active_class": true,
                },
                "infrastructure": {
                    "display_name": "Infrastructure",
                    "classes": [
                        {
                            "name": "Sign",
                            "color": "red",
                            "id": 20,
                            "keybind": "4",
                            "allowed_modes": ["point"],
                        },
                        {
                            "name": "Building",
                            "color": "green",
                            "id": 21,
                            "keybind": "5",
                            "allowed_modes": ["bbox", "polygon"],
                        },
                    ],
                    "allowed_modes": ["point", "bbox", "polygon", "delete_bbox"],
                    "resume_from": infrastructure_annotations,
                    "task_meta": null,
                    "annotation_meta": null,
                    "focus_active_class": true,
                    // Make the dimming more dramatic than the 0.4 default
                    "defocused_opacity": 0.2,
                }
            };

            const AllowedToolboxItem = ULabel.get_allowed_toolbox_item_enum();
            let ulabel = new ULabel({
                "container_id": "container",
                "image_data": "https://ulabel.s3.us-east-2.amazonaws.com/cs-demo-0.png",
                "username": "DemoUser",
                "submit_buttons": [
                    {
                        "name": "Submit",
                        "hook": on_submit,
                    },
                ],
                "subtasks": subtasks,
                "initial_line_size": 3,
                "toolbox_order": [
                    AllowedToolboxItem.Keybinds,
                    AllowedToolboxItem.SubmitButtons,
                    AllowedToolboxItem.ModeSelect,
                    AllowedToolboxItem.ZoomPan,
                    AllowedToolboxItem.AnnotationID,
                    AllowedToolboxItem.ClassCounter,
                    AllowedToolboxItem.AnnotationList,
                    AllowedToolboxItem.AnnotationResize,
                ],
            });
            // Wait for ULabel instance to finish initialization
            ulabel.init(function () {
                console.log(ulabel);
            });

            // External control: toggle focus-follows-active-class on both subtasks.
            // Derives from instance state so the shift+f keybind stays in sync.
            function update_focus_label() {
                const on = Object.keys(subtasks).some((key) => ulabel.subtasks[key].focus_active_class);
                $("#toggle-focus").text("Class focus: " + (on ? "ON" : "OFF"));
            }
            $("#toggle-focus").on("click", function () {
                const next = !Object.keys(subtasks).every((key) => ulabel.subtasks[key].focus_active_class);
                for (const subtask_key of Object.keys(subtasks)) {
                    ulabel.set_focus_active_class(subtask_key, next);
                }
                update_focus_label();
            });
            // The keybind toggles only the current subtask; keep the label honest
            $(document).on("keyup", update_focus_label);

            // Expose ulabel instance globally for testing
            window.ulabel = ulabel;
        });
    </script>
</head>

<body>
    <div id="container" style="width: 100%; height: 100vh; position: absolute; top: 0; left: 0;"></div>
    <button id="toggle-focus"
        style="position: fixed; top: 10px; right: 10px; z-index: 9999; padding: 6px 12px;">Class focus: ON</button>
</body>

</html>
